          <style>
            :root {

            }

            .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
            .title { font-weight: 700; letter-spacing: 0.4px; }
            .controls { display: flex; gap: 8px; flex-wrap: wrap; }
            button { background: #0b1220; color: var(--text); border: 1px solid #334155; padding: 10px 14px; border-radius: 10px; cursor: pointer; }

            .status { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0 20px; }

            .slot { width: 40px; height: 56px; border-radius: 10px; background: #0b1220; border: 1px dashed #334155; display: grid; place-items: center; font-size: 24px; font-weight: 700; text-transform: uppercase; }
            .hint { text-align: center; color: var(--muted); margin-bottom: 12px; }
            .keyboard { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }

            .gallows { width: 120px; height: 120px; border: 1px solid #1f2937; border-radius: 12px; position: relative; background: #0b1220; }
            .stage-0::before { content: ""; position: absolute; left: 12px; bottom: 8px; width: 96px; height: 6px; background: #334155; }
            .stage-1::after { content: ""; position: absolute; left: 24px; bottom: 8px; width: 6px; height: 90px; background: #334155; }
            .stage-2 .beam { position: absolute; left: 24px; top: 12px; width: 70px; height: 6px; background: #334155; }
            .stage-3 .rope { position: absolute; left: 88px; top: 18px; width: 2px; height: 18px; background: #64748b; }
            .stage-4 .head { position: absolute; left: 80px; top: 34px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #64748b; }
            .stage-5 .body { position: absolute; left: 88px; top: 52px; width: 2px; height: 26px; background: #64748b; }

            .stage-7 .arm-r { position: absolute; left: 88px; top: 60px; width: 14px; height: 2px; background: #64748b; transform: rotate(25deg); transform-origin: left; }

        <body>
          <div class="game">
            <div class="header">
              <div class="title">Hangman – Word Guessing Game (English)</div>
              <div class="controls">
                <button id="newGame">New game</button>
                <button id="revealAnswer" style="display:none;">Reveal answer</button>
              </div>
            </div>

            <div class="status">
              <div class="card">
                <div class="label">Incorrect guesses</div>
                <div class="value" id="wrongLetters">—</div>
              </div>
              <div class="card">
                <div class="label">Remaining attempts</div>
                <div class="value" id="remaining">9</div>
              </div>
            </div>

            <div class="hangman">
              <div class="gallows stage-0" id="gallows">
                <div class="beam"></div>
                <div class="rope"></div>
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm-l"></div>
                <div class="arm-r"></div>
                <div class="leg-l"></div>
                <div class="leg-r"></div>
              </div>
              <div>
                <div class="hint" id="hint">Guess the word by selecting letters.</div>
                <div class="word" id="word"></div>
                <div class="keyboard" id="keyboard"></div>
                <div class="result" id="result"></div>
              </div>
            </div>

            <div class="footer">
              <div>Tip: You can also use your keyboard to guess letters.</div>
              <div>Max mistakes: 9</div>
            </div>
          </div>

          <script>
            // English-only word bank
            const WORDS = [
              { word: "algorithm", hint: "Step-by-step procedure for solving problems" },
              { word: "variable", hint: "A named storage for data in code" },
              { word: "function", hint: "Reusable block of code" },
              { word: "network", hint: "Connected devices that share resources" },
              { word: "automation", hint: "Tasks performed with minimal human input" }
            ];

            const MAX_MISTAKES = 9;
            const alphabet = "abcdefghijklmnopqrstuvwxyz".split("");

            let secret = "";
            let hint = "";
            let revealed = [];
            let wrong = new Set();
            let mistakes = 0;

            const els = {
              word: document.getElementById("word"),
              keyboard: document.getElementById("keyboard"),
              wrongLetters: document.getElementById("wrongLetters"),
              remaining: document.getElementById("remaining"),
              result: document.getElementById("result"),
              hint: document.getElementById("hint"),
              gallows: document.getElementById("gallows"),
              newGame: document.getElementById("newGame"),
              revealAnswer: document.getElementById("revealAnswer")
            };

            function normalize(str) { return str.replace(/\s+/g, ""); }

            function pickWord() {
              const item = WORDS[Math.floor(Math.random() * WORDS.length)];
              secret = normalize(item.word);
              hint = item.hint;
              revealed = Array(secret.length).fill("");
              wrong.clear();
              mistakes = 0;
              els.revealAnswer.style.display = 'none';
              updateUI();
              renderKeyboard();
              els.result.textContent = "";
            }

            function updateUI() {
              els.word.innerHTML = "";
              revealed.forEach((ch, i) => {
                const div = document.createElement("div");
                div.className = "slot";
                div.textContent = ch || "";
                els.word.appendChild(div);
              });
              els.wrongLetters.textContent = wrong.size ? [...wrong].join(", ").toUpperCase() : "—";
              els.remaining.textContent = Math.max(0, MAX_MISTAKES - mistakes);
              els.hint.textContent = hint;
              els.gallows.className = "gallows stage-" + mistakes;
            }

            function renderKeyboard() {
              els.keyboard.innerHTML = "";
              alphabet.forEach(letter => {
                const btn = document.createElement("button");
                btn.className = "key";
                btn.textContent = letter;
                btn.disabled = wrong.has(letter) || revealed.includes(letter);
                btn.addEventListener("click", () => guess(letter));
                els.keyboard.appendChild(btn);
              });
            }

            function refreshKeyStyles() {
              [...els.keyboard.children].forEach(btn => {
                const letter = btn.textContent;
                btn.classList.remove("correct", "wrong");
                if (revealed.includes(letter)) btn.classList.add("correct");
                if (wrong.has(letter)) btn.classList.add("wrong");
                btn.disabled = wrong.has(letter) || revealed.includes(letter);
              });
            }

            function guess(letter) {
              if (isFinished()) return;
              let hit = false;
              for (let i = 0; i < secret.length; i++) {
                if (secret[i].toLowerCase() === letter.toLowerCase() && !revealed[i]) {
                  revealed[i] = secret[i];
                  hit = true;
                }
              }
              if (!hit) {
                if (!wrong.has(letter)) { wrong.add(letter); mistakes++; }
              }
              updateUI();
              refreshKeyStyles();
              checkEnd();
            }

            function isFinished() { const won = revealed.every(ch => ch !== ""); const lost = mistakes >= MAX_MISTAKES; return won || lost; }

            function checkEnd() {
              const won = revealed.every(ch => ch !== "");
              const lost = mistakes >= MAX_MISTAKES;
              if (won) {
                els.result.innerHTML = `🎉 <span class="win">You win!</span> The word was: <strong>${secret}</strong>`;
                disableAllKeys();
                els.revealAnswer.style.display = 'inline-block';
              } else if (lost) {
                els.result.innerHTML = `💥 <span class="lose">You lose.</span> The word was: <strong>${secret}</strong>`;
                disableAllKeys();
                els.revealAnswer.style.display = 'inline-block';
              }
            }

            function disableAllKeys() { [...els.keyboard.children].forEach(btn => btn.disabled = true); }

            window.addEventListener("keydown", (e) => { const key = e.key.toLowerCase(); if (key.length === 1 && key >= "a" && key <= "z") { guess(key); } });

            // Controls
            els.newGame.addEventListener("click", pickWord);
            els.revealAnswer.addEventListener("click", () => { revealed = secret.split(""); updateUI(); refreshKeyStyles(); els.revealAnswer.style.display = 'none'; });

            // Start
            pickWord();
          </script>
        </body>
        </html>
